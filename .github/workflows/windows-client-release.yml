# Windows desktop client (electron/): 卫戍协议.exe opens the game in its own window — every file from this computer
# (app://game/, served in-process, no local HTTP server); server picker: cloud / offline / LAN host / custom servers.
# Release assets (tag vX.Y.Z[-pre], e.g. v0.2.4-desktop.1 → app version 0.2.4-desktop.1):
#   Stronghold-Protocol-Desktop-Setup-<version>.exe (+ .blockmap, latest.yml)  NSIS installer; electron-updater
#                                                     updates installed copies from these (differential via blockmap)
#   Stronghold-Protocol-Desktop-<version>-win-x64.zip  portable; its updater offers the next zip for download
# Art is NOT in the app (since desktop.4): it is published as release art-<hash12> (publish-art.sh, only when the
# art changed) and installed by the app on first start (electron/art.js); the build embeds its manifest.
# Art source: the upstream release's full bundle (sganggs/Stronghold-Protocol, same version, sha256 = the digest GitHub
# publishes) via .github/scripts/upstream-art.py — it carries the local-client art (3D board, HUD icons, summon models)
# tools/setup.mjs cannot produce on a runner; setup then fills anything missing from the public mirrors.
# Also callable from other workflows (workflow_call: upstream-sync-build.yml).
# Optionally also the older portable node.exe bundle (scripts/make-windows-bundle.mjs --cloud). Built on Linux (NSIS
# needs wine there) for Windows x64.
name: Windows client release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (semver, e.g. v0.2.4-desktop.1)
        required: true
        default: v0.2.4-desktop.1
      server:
        description: Default game server (WebSocket URL)
        required: true
        default: wss://stronghold-xili.japaneast.cloudapp.azure.com/ws
      portable:
        description: Also attach the portable node.exe bundle (+~476 MB)
        type: boolean
        default: false
      publish:
        description: Publish the release (off = build + checks only, nothing is released)
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: Release tag to create or update (semver)
        type: string
        required: true
      ref:
        description: Commit to build (default the calling run's commit)
        type: string
        default: ''
      server:
        description: Default game server (WebSocket URL)
        type: string
        default: wss://stronghold-xili.japaneast.cloudapp.azure.com/ws
      portable:
        type: boolean
        default: false
      notes:
        description: Extra text at the top of the release notes
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: windows-client-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.meta.outputs.version }}
      art_tag: ${{ steps.meta.outputs.art_tag }}
      art_bytes: ${{ steps.meta.outputs.art_bytes }}
      game_version: ${{ steps.meta.outputs.game_version }}
      local_art: ${{ steps.meta.outputs.local_art }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      SERVER_URL: ${{ inputs.server || 'wss://stronghold-xili.japaneast.cloudapp.azure.com/ws' }}
      PORTABLE: ${{ inputs.portable && 'true' || 'false' }}
      BUILD_REF: ${{ inputs.ref || github.sha }}
    steps:
      - name: Check the tag (semver → app version)
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' is not vX.Y.Z or vX.Y.Z-pre (the updater compares versions as semver)"; exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Game art from the upstream release (sha256-verified), then setup fills any gaps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          python3 .github/scripts/upstream-art.py --dest . || rc=$?
          if [ "$rc" != 0 ] && [ "$rc" != 3 ]; then exit "$rc"; fi
          node tools/setup.mjs -y --no-local
          GAME_VERSION=$(node -p "require('./package.json').version")
          echo "GAME_VERSION=$GAME_VERSION" >> "$GITHUB_ENV"
          if [ -f data/local-assets.json ]; then echo "LOCAL_ART=yes" >> "$GITHUB_ENV"; else echo "LOCAL_ART=no" >> "$GITHUB_ENV"; fi

      - name: Art pack (published once per art hash as release art-<hash12>; the app downloads it, not bundled)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/publish-art.sh "$RUNNER_TEMP/art"
          cp "$RUNNER_TEMP/art/art-manifest.json" electron/art-manifest.json

      - name: Set the default game server
        run: |
          sed -i "s#^const DEFAULT_SERVER = .*#const DEFAULT_SERVER = '${SERVER_URL}';#" electron/main.js
          grep -n "^const DEFAULT_SERVER" electron/main.js

      - name: Cache electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('electron/package-lock.json', 'package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install wine (electron-builder needs it for the NSIS installer on Linux)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends wine wine64 wine32:i386 > /dev/null
          # the `wine` command comes from package `wine`; fall back to the wine64 loader if a release lacks it
          if ! command -v wine > /dev/null && [ -x /usr/lib/wine/wine64 ]; then sudo ln -sf /usr/lib/wine/wine64 /usr/local/bin/wine; fi
          command -v wine
          wine --version

      - name: Build the desktop app (Windows x64, NSIS installer + unpacked folder)
        working-directory: electron
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder --win nsis --x64 --publish never -c.extraMetadata.version="$VERSION"
          ls -l dist
          cat dist/latest.yml
          test -f dist/win-unpacked/resources/art-manifest.json
          if [ -d dist/win-unpacked/resources/game/public/assets ]; then echo "::error::art bundled in the app"; exit 1; fi
          du -sh dist/win-unpacked
          (cd dist && sha256sum "Stronghold-Protocol-Desktop-Setup-$VERSION.exe" | tee "Stronghold-Protocol-Desktop-Setup-$VERSION.exe.sha256")

      - name: Packaged app check (every import from main.js resolves inside app.asar / resources/game)
        run: |
          npx -y @electron/asar@3 extract electron/dist/win-unpacked/resources/app.asar "$RUNNER_TEMP/app-asar"
          node tools/check-electron-pack.mjs "$RUNNER_TEMP/app-asar" electron/dist/win-unpacked/resources/game

      - name: Zip the desktop app (UTF-8 file names)
        id: desktop
        run: |
          ZIP="$RUNNER_TEMP/Stronghold-Protocol-Desktop-$VERSION-win-x64.zip"
          python3 - electron/dist/win-unpacked "$ZIP" <<'PY'
          import os, sys, zipfile
          src, out = sys.argv[1], sys.argv[2]
          top = '卫戍协议'
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for d, _, files in os.walk(src):
                  for f in sorted(files):
                      p = os.path.join(d, f)
                      z.write(p, top + '/' + os.path.relpath(p, src).replace(os.sep, '/'))
          PY
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$ZIP")" | tee "$ZIP.sha256")
          ls -l "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Build the portable bundle (optional)
        id: portable
        if: env.PORTABLE == 'true'
        run: |
          node scripts/make-windows-bundle.mjs --out "$RUNNER_TEMP/out/Stronghold-Protocol-Windows" --cloud "$SERVER_URL"
          ZIP="$RUNNER_TEMP/Stronghold-Protocol-Windows-client-$TAG.zip"
          cd "$RUNNER_TEMP/out"
          python3 - "$ZIP" <<'PY'
          import os, sys, zipfile
          root = 'Stronghold-Protocol-Windows'
          with zipfile.ZipFile(sys.argv[1], 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for d, _, files in os.walk(root):
                  for f in sorted(files):
                      p = os.path.join(d, f)
                      z.write(p, p.replace(os.sep, '/'))
          PY
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$ZIP")" | tee "$ZIP.sha256")
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: List the release files
        id: files
        env:
          DESKTOP_ZIP: ${{ steps.desktop.outputs.zip }}
          PORTABLE_ZIP: ${{ steps.portable.outputs.zip }}
        run: |
          {
            echo "list<<EOF"
            SETUP="electron/dist/Stronghold-Protocol-Desktop-Setup-$VERSION.exe"
            printf '%s\n' "$SETUP" "$SETUP.sha256" "$SETUP.blockmap" electron/dist/latest.yml
            for z in "$DESKTOP_ZIP" "$PORTABLE_ZIP"; do
              if [ -n "$z" ]; then printf '%s\n%s\n' "$z" "$z.sha256"; fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Stage the release files
        id: meta
        env:
          LIST: ${{ steps.files.outputs.list }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          printf '%s\n' "$LIST" | while read -r f; do [ -n "$f" ] && cp "$f" "$RUNNER_TEMP/release/"; done
          ls -l "$RUNNER_TEMP/release"
          { echo "version=$VERSION"; echo "art_tag=$ART_TAG"; echo "art_bytes=$ART_BYTES"; echo "game_version=$GAME_VERSION"; echo "local_art=$LOCAL_ART"; } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ runner.temp }}/release
          retention-days: 3

  # Launch the packaged app on Windows: main.js --smoke loads every main-process module and the bundled game server,
  # writes SP_SMOKE_OK and quits (a missing module = ERR_MODULE_NOT_FOUND = no file).
  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Launch the packaged app (--smoke)
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          Expand-Archive "release/Stronghold-Protocol-Desktop-$env:VERSION-win-x64.zip" -DestinationPath app
          $exe = Get-ChildItem app -Recurse -Filter *.exe | Where-Object { $_.Directory.Name -eq '卫戍协议' -and $_.Name -like '卫戍协议*.exe' } | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem app -Recurse -Filter *.exe | Where-Object { $_.Name -notmatch 'Uninstall|elevate' } | Select-Object -First 1 }
          Write-Host "exe: $($exe.FullName)"
          $env:SP_SMOKE_OUT = "$PWD\smoke.txt"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke','--disable-gpu' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error 'smoke: app did not quit within 120 s' }
          if (-not (Test-Path smoke.txt)) { Write-Error "smoke: no SP_SMOKE_OK (exit $($p.ExitCode))"; exit 1 }
          Get-Content smoke.txt
          if (-not (Select-String -Path smoke.txt -Pattern "SP_SMOKE_OK .* $env:VERSION")) { Write-Error 'smoke: wrong version'; exit 1 }

  publish:
    needs: [build, smoke]
    if: inputs.publish != false
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      BUILD_REF: ${{ inputs.ref || github.sha }}
      VERSION: ${{ needs.build.outputs.version }}
      ART_TAG: ${{ needs.build.outputs.art_tag }}
      ART_BYTES: ${{ needs.build.outputs.art_bytes }}
      GAME_VERSION: ${{ needs.build.outputs.game_version }}
      LOCAL_ART: ${{ needs.build.outputs.local_art }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Windows client ${{ env.TAG }}
          target_commitish: ${{ env.BUILD_REF }}
          body: |
            ${{ inputs.notes }}
            卫戍协议：盟约 Windows 桌面客户端 ${{ env.VERSION }}（非官方同人，严禁盈利；游戏素材版权归原权利人，见 NOTICE.md）。
            · 安装版（推荐，可自动更新）：下载 Stronghold-Protocol-Desktop-Setup-${{ env.VERSION }}.exe 运行安装。
            · 便携版：下载 Stronghold-Protocol-Desktop-${{ env.VERSION }}-win-x64.zip，解压后双击「卫戍协议.exe」。
            · 美术资源与程序分离：安装包只含程序；首次启动自动下载美术资源包 ${{ env.ART_TAG }}（约 ${{ env.ART_BYTES }} 字节，sha256 校验，可断点续传，GitHub 失败时自动换镜像），之后的程序更新不再重复下载。从 desktop.3 升级会直接复用已安装的美术文件。
            · 美术资源包：https://github.com/${{ github.repository }}/releases/tag/${{ env.ART_TAG }}
            启动时选择服务器：云服务器联机 / 离线单人 / 本机开服 / 自定义服务器（Ctrl+Shift+M 随时切换）。
            游戏版本 ${{ env.GAME_VERSION }}（含本地客户端美术：${{ env.LOCAL_ART }}）。云服务器联机需要服务器运行同一游戏版本；版本不同时选择页会提示，可改用离线单人 / 本机开服。
            未签名程序：Windows SmartScreen 提示时点「更多信息 → 仍要运行」。
          files: release/*
          fail_on_unmatched_files: true
