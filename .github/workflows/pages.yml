# Web client on GitHub Pages (https://<owner>.github.io/<repo>/): the same server-less build as the Android app
# (mobile/scripts/build-www.mjs --target pages): picker cloud / offline (in-page server) / custom wss:// servers; a
# service worker maps the game's root-relative URLs under the base path and caches the shell and, on demand, the art.
# Limits checked before deploying: no file over 100 MB, site under 1 GB.
# Called by upstream-sync-build.yml after a release; also by hand.
name: Web client (GitHub Pages)

on:
  workflow_dispatch:
    inputs:
      server:
        description: Default game server (WebSocket URL)
        default: wss://stronghold-xili.japaneast.cloudapp.azure.com/ws
  workflow_call:
    inputs:
      ref: { type: string, default: '' }
      version: { type: string, default: '' }
      server: { type: string, default: 'wss://stronghold-xili.japaneast.cloudapp.azure.com/ws' }

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          (cd mobile && npm ci --no-audit --no-fund)

      - name: Game art from the upstream release (sha256-verified), then setup fills any gaps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          python3 .github/scripts/upstream-art.py --dest . || rc=$?
          if [ "$rc" != 0 ] && [ "$rc" != 3 ]; then exit "$rc"; fi
          node tools/setup.mjs -y --no-local

      - name: Build the site
        env:
          SERVER_URL: ${{ inputs.server || 'wss://stronghold-xili.japaneast.cloudapp.azure.com/ws' }}
          VERSION_IN: ${{ inputs.version }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          VERSION="${VERSION_IN:-$(node -p "require('./package.json').version")-web.$(date -u +%Y%m%d%H%M)}"
          node mobile/scripts/build-www.mjs --target pages --base "/$REPO/" --out _site --version "$VERSION" --cloud "$SERVER_URL"
          big=$(find _site -type f -size +100M)
          if [ -n "$big" ]; then echo "::error::files over 100 MB: $big"; exit 1; fi
          total=$(du -sb _site | cut -f1)
          echo "site: $((total / 1048576)) MB, $(find _site -type f | wc -l) files"
          if [ "$total" -gt 1000000000 ]; then echo "::error::site is over 1 GB (GitHub Pages limit)"; exit 1; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
