name: CI

# Actions usage (GitHub pauses busy forks): a push to a branch runs the light matrix (Linux, Node 22, 4 shards = 5 jobs);
# tags, pull requests and manual runs run the full one (Linux + Windows × Node 22 + 24 × 4 shards = 17 jobs).
# Docs-only pushes run nothing.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', 'LICENSE', 'NOTICE*']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
        # 22 and 24 = the maintained LTS lines (24 is what `winget install OpenJS.NodeJS.LTS` installs today)
        node: ${{ fromJSON(github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && '[22]' || '[22, 24]') }}
        # node --test --test-shard splits the test files 4 ways: ~4 min per job instead of ~15
        shard: [1, 2, 3, 4]
    env:
      # Browser/E2E suites gate themselves on these (and on a local Chrome + downloaded game assets, which CI never
      # has): keep them off explicitly. Suites that need .cache/gamedata, public/assets or data/local-assets.json skip.
      SP_E2E: '0'
      SP_REAL_E2E: '0'
      RENDER_E2E: '0'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # node_modules + the vendored copies, keyed by OS / node / lockfile; on a hit npm ci is skipped
      - id: nm
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            public/vendor
          key: nm-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('package-lock.json', 'tools/vendor.mjs') }}

      - name: Install (npm ci → postinstall copies public/vendor)
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Setup check (no downloads)
        run: node tools/setup.mjs --check --no-local

      - name: Unit & integration tests
        run: node --test --test-shard=${{ matrix.shard }}/4 ${{ runner.os == 'Windows' && '"test/*.test.{js,mjs,cjs}" "test/{content,match,render,sim,ui}/**/*.test.{js,mjs,cjs}"' || '"test/**/*.test.{js,mjs,cjs}"' }}

      - name: Server smoke test (boot, /healthz, index.html, doctor)
        shell: bash
        run: |
          node server/index.js > server.log 2>&1 &
          pid=$!
          ok=
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then ok=1; break; fi
            sleep 1
          done
          echo
          [ -n "$ok" ] || { cat server.log; exit 1; }
          # Save the page first: piping curl into `grep -q` let grep exit on the first match, curl then failed with a
          # write error (23) and pipefail turned that into a flaky red step.
          curl -fsS -o index.out http://127.0.0.1:3000/
          grep -qi '<html' index.out
          curl -fsS -o /dev/null http://127.0.0.1:3000/vendor/pixi.min.js
          node tools/doctor.mjs || true
          kill $pid || true

  # Separate from the test matrix so lint / types / import boundaries run once, not four times.
  # Lint warnings do not fail the job (npm run lint does not pass --max-warnings=0).
  tooling:
    name: tooling (lint, imports, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - id: nm
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            public/vendor
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'tools/vendor.mjs') }}

      - name: Install (npm ci → postinstall copies public/vendor)
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Lint (warnings allowed)
        run: npm run lint

      - name: Import boundaries
        run: npm run check:imports

      - name: Typecheck
        run: npm run typecheck
